<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DialectGuard Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com/3.4.10"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', '"PingFang SC"', '"Microsoft YaHei"', 'system-ui', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
          wx: ['"PingFang SC"', '"Microsoft YaHei"', '-apple-system', 'Inter', 'sans-serif'],
        },
        colors: {
          wx: { green: '#07C160', bubble: '#95EC69', bg: '#EDEDED', bar: '#F7F7F7', line: '#D9D9D9', gray: '#B2B2B2' },
          wb: { lime: '#A6CE39', ink: '#141414', graphite: '#2A2A2A' },
        },
      },
    },
  };
</script>
<style>
  html, body, #root { height: 100%; }
  body { margin: 0; background: #E6E7EA; -webkit-font-smoothing: antialiased; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  .thin-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .thin-scroll::-webkit-scrollbar-thumb { background: rgba(120,120,120,.35); border-radius: 3px; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
  .pop { animation: pop .28s ease-out both; }
  @keyframes redPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.55); } 50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } }
  .red-pulse { animation: redPulse 1.4s ease-in-out infinite; }
  @keyframes flash { 0%,100% { background: rgba(239,68,68,0); } 50% { background: rgba(239,68,68,.18); } }
  .flash-red { animation: flash 1.1s ease-in-out 3; }
  @keyframes wave { 0% { opacity: .25; } 50% { opacity: 1; } 100% { opacity: .25; } }
  .wave-1 { animation: wave 1s infinite 0s; } .wave-2 { animation: wave 1s infinite .2s; } .wave-3 { animation: wave 1s infinite .4s; }
  @keyframes dots { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }
  .dot { animation: dots 1.2s infinite; } .dot:nth-child(2) { animation-delay: .2s; } .dot:nth-child(3) { animation-delay: .4s; }
  .tail-in::before, .tail-out::before { content: ''; position: absolute; top: 13px; width: 10px; height: 10px; transform: rotate(45deg); border-radius: 1px; background: inherit; }
  .tail-in::before { left: -4px; }
  .tail-out::before { right: -4px; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script>window.react = window.React;</script>
<script src="https://unpkg.com/lucide-react@0.454.0/dist/umd/lucide-react.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;
const {
  ChevronLeft, ChevronRight, MoreHorizontal, Signal, Wifi, BatteryFull, Mic, Keyboard, Camera, Smile, PlusCircle,
  ShieldCheck, ShieldAlert, Eye, EyeOff, Headphones, Home, PieChart, Shield, ListOrdered, Lock, Copy, Check,
  RotateCcw, AlertTriangle, CheckCircle2, XCircle, Terminal, Users, Snowflake, Zap, BadgeCheck, Link2,
} = window.LucideReact;

/* ---------- helpers ---------- */
const fmt = (n) => n.toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const clock = () => new Date().toLocaleTimeString('en-GB', { hour12: false });
const hhmm = () => new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const hex = (n) => Array.from({ length: n }, () => Math.floor(Math.random() * 16).toString(16)).join('');
let _uid = 0;
const nid = () => ++_uid;

const INITIAL_BALANCE = 1500;
const initTxns = () => [
  { id: 'TXN_88899', payee: 'Air Selangor (Water Bill)', amount: 18.2, tier: 2, status: 'SUCCESS', date: '08 Oct' },
  { id: 'TXN_88900', payee: 'Kedai Ubat Tong Sheng', amount: 145.0, tier: null, status: 'SUCCESS', date: '11 Oct' },
];
const initParent = () => [
  { id: nid(), kind: 'time', text: '09:12' },
  {
    id: nid(), side: 'in', kind: 'text',
    text: '早晨婆婆！我系你嘅理财助手 🛡️\n按住下面个掣讲嘢就得，唔使打字。',
    en: "Good morning Grandma! I'm your finance helper. Just hold the button below and speak — no typing needed.",
  },
];
const initChild = () => [
  { id: nid(), kind: 'time', text: 'Sun 20:00' },
  { id: nid(), side: 'in', kind: 'insight' },
];
const initLogs = () => [
  { t: clock(), tag: 'System', text: 'DialectGuard sandbox booted | Open Banking API v2.1 (sandbox) | Acct #8829-102 linked', level: 'ok' },
  { t: clock(), tag: 'Guardrail-Gateway', text: 'Policy loaded: TIER_1=READ_ONLY, TIER_2=WHITELIST<=50.00+VOICE_CONFIRM, TIER_3=FREEZE+MAKER_CHECKER', level: 'info' },
];

/* ---------- small UI atoms ---------- */
function useClock() {
  const [t, setT] = useState(hhmm());
  useEffect(() => { const i = setInterval(() => setT(hhmm()), 10000); return () => clearInterval(i); }, []);
  return t;
}

function Money({ value, className = '', cents = 'text-[0.6em]' }) {
  const [whole, dec] = fmt(value).split('.');
  return <span className={`font-mono tracking-tight ${className}`}>RM {whole}<span className={cents}>.{dec}</span></span>;
}

function Waves({ playing, flip }) {
  return (
    <svg width="18" height="18" viewBox="0 0 24 24" className={flip ? 'rotate-180' : ''} fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round">
      <circle cx="5" cy="12" r="1.8" fill="currentColor" stroke="none" className={playing ? 'wave-1' : ''} />
      <path d="M9.5 7.5a6.5 6.5 0 0 1 0 9" className={playing ? 'wave-2' : ''} />
      <path d="M13.5 4a11 11 0 0 1 0 16" className={playing ? 'wave-3' : ''} />
    </svg>
  );
}

function Avatar({ who }) {
  const map = {
    bot: { bg: 'bg-wx-green', node: <ShieldCheck size={22} className="text-white" /> },
    guardbot: { bg: 'bg-[#2B2B2B]', node: <ShieldAlert size={21} className="text-wb-lime" /> },
    parent: { bg: 'bg-[#F0B35A]', node: <span className="text-white text-lg font-semibold">婆</span> },
    child: { bg: 'bg-[#5B8DEF]', node: <span className="text-white text-lg font-semibold">明</span> },
  };
  const a = map[who];
  return <div className={`w-10 h-10 shrink-0 rounded-[5px] flex items-center justify-center ${a.bg}`}>{a.node}</div>;
}

/* ---------- WeChat message kinds ---------- */
function Bubble({ side, children, big }) {
  const color = side === 'out' ? 'bg-wx-bubble' : 'bg-white';
  return (
    <div className={`relative rounded-[5px] px-3 py-2.5 ${color} ${side === 'out' ? 'tail-out' : 'tail-in'} ${big ? 'text-[17px] leading-[1.5]' : 'text-[15px] leading-[1.45]'} text-[#191919] whitespace-pre-line break-words`}>
      {children}
    </div>
  );
}

function VoiceMsg({ m, big }) {
  const [playing, setPlaying] = useState(false);
  const out = m.side === 'out';
  const play = () => { setPlaying(true); setTimeout(() => setPlaying(false), m.dur * 1000); };
  const width = Math.min(90 + m.dur * 9, 200);
  return (
    <div className={`flex flex-col ${out ? 'items-end' : 'items-start'} gap-1.5`}>
      <div className={`flex items-center gap-2 ${out ? 'flex-row-reverse' : ''}`}>
        <button onClick={play} style={{ width }} className={`relative rounded-[5px] h-10 px-3 flex items-center ${out ? 'bg-wx-bubble tail-out justify-end' : 'bg-white tail-in justify-start'} text-[#191919] hover:brightness-95`}>
          <Waves playing={playing} flip={out} />
        </button>
        <span className="text-[13px] text-[#9A9A9A]">{m.dur}"</span>
      </div>
      <div className={`max-w-full rounded-[5px] px-3 py-2 ${out ? 'bg-wx-bubble/70' : 'bg-white/90'} border border-black/5`}>
        <div className="flex items-center gap-1.5 mb-1">
          <span className="text-[10px] font-semibold tracking-wide uppercase text-[#576B95] bg-[#576B95]/10 rounded px-1.5 py-0.5">🎤 {m.dialect}</span>
        </div>
        <p className={`${big ? 'text-[16px]' : 'text-[14px]'} leading-snug text-[#191919]`}>{m.text}</p>
        {m.en && <p className="mt-1 text-[12px] leading-snug italic text-[#7A7A7A]">EN: {m.en}</p>}
      </div>
    </div>
  );
}

function BillImage() {
  return (
    <div className="w-[190px] rounded-[5px] overflow-hidden shadow-md bg-[#d8d3c8] p-2 rotate-[-1.5deg]">
      <div className="bg-[#FBFAF6] rounded-sm p-2.5 text-[9px] leading-tight text-[#333] font-sans">
        <div className="flex items-center justify-between border-b border-[#ddd] pb-1.5 mb-1.5">
          <div className="flex items-center gap-1"><Zap size={12} className="text-[#E2231A]" /><b className="text-[10px]">TNB</b></div>
          <span className="text-[8px] text-[#777]">BIL ELEKTRIK</span>
        </div>
        <div className="flex justify-between"><span>No. Akaun</span><span className="font-mono">2200-1234-5678</span></div>
        <div className="flex justify-between"><span>Tempoh</span><span>Sep 2026</span></div>
        <div className="flex justify-between"><span>Penggunaan</span><span>178 kWh</span></div>
        <div className="flex justify-between"><span>Tarikh Akhir</span><span>28/10/2026</span></div>
        <div className="mt-1.5 pt-1.5 border-t border-dashed border-[#bbb] flex justify-between items-end">
          <span className="font-semibold">JUMLAH</span><span className="font-mono text-[13px] font-bold text-[#111]">RM 42.50</span>
        </div>
        <div className="mt-1.5 h-4 bg-[repeating-linear-gradient(90deg,#222_0_1px,transparent_1px_3px)] opacity-70" />
      </div>
    </div>
  );
}

function ScamCard() {
  return (
    <div className="w-[240px] bg-white rounded-[5px] p-3 shadow-sm">
      <p className="text-[15px] leading-snug text-[#191919] font-medium">🎉 恭喜您中奖 RM 50,000！限时24小时领取</p>
      <div className="mt-2 flex gap-2">
        <p className="flex-1 text-[12px] leading-snug text-[#8A8A8A]">请先转账 RM 800 解冻奖金至 Acct #9910-SCAM，逾期作废！</p>
        <div className="w-12 h-12 rounded bg-gradient-to-br from-[#FFD54F] to-[#F57C00] flex items-center justify-center text-xl shrink-0">🎁</div>
      </div>
      <div className="mt-2 pt-2 border-t border-[#EEE] flex items-center gap-1 text-[11px] text-[#A0A0A0]"><Link2 size={11} /> lucky-draw-my.xyz · Forwarded</div>
    </div>
  );
}

function ReceiptCard({ m }) {
  return (
    <div className="w-[250px] bg-white rounded-[6px] overflow-hidden shadow-sm">
      <div className="px-4 pt-3 pb-1 text-[12px] text-[#8A8A8A] flex items-center gap-1.5"><BadgeCheck size={14} className="text-wx-green" /> 缴费成功 · Payment Successful</div>
      <div className="px-4 pb-3 text-center">
        <div className="text-[13px] text-[#555] mt-1">{m.payee}</div>
        <div className="font-mono text-[28px] font-semibold text-[#111] mt-1">-{fmt(m.amount)}</div>
      </div>
      <div className="px-4 py-2.5 border-t border-[#F0F0F0] text-[12px] space-y-1 text-[#666]">
        <div className="flex justify-between"><span>Txn ID</span><span className="font-mono text-[#111]">{m.txnId}</span></div>
        <div className="flex justify-between"><span>Tier</span><span className="text-[#2563EB] font-medium">TIER 2 · Voice-confirmed</span></div>
        <div className="flex justify-between"><span>Balance</span><span className="font-mono text-[#111]">RM {fmt(m.balance)}</span></div>
      </div>
    </div>
  );
}

function InsightCard() {
  const rows = [
    ['Groceries', 'RM 168.00', 'text-[#111]'],
    ['Health supplements', 'RM 145.00 ⚠️', 'text-[#D97706]'],
    ['Utilities', 'RM 18.20', 'text-[#111]'],
    ['Scam attempts blocked', '0', 'text-[#111]'],
  ];
  return (
    <div className="w-[260px] bg-white rounded-[6px] overflow-hidden shadow-sm">
      <div className="px-3.5 pt-3 text-[11px] text-[#8A8A8A] flex items-center gap-1.5"><PieChart size={13} className="text-wx-green" /> Weekly Insights · Week 41</div>
      <div className="px-3.5 pt-1.5 pb-2.5">
        <div className="text-[15px] font-semibold text-[#191919]">Ah Por (Mdm. Tan) spending</div>
        <div className="mt-1 text-[12px] text-[#666]">Spent <b className="font-mono text-[#111]">RM 331.20</b> of RM 350 weekly budget</div>
        <div className="mt-2 h-1.5 rounded-full bg-[#EEE] overflow-hidden"><div className="h-full bg-wx-green" style={{ width: '94%' }} /></div>
      </div>
      <div className="px-3.5 py-2 border-t border-[#F2F2F2] space-y-1 text-[12px]">
        {rows.map(([k, v, c]) => <div key={k} className="flex justify-between text-[#666]"><span>{k}</span><span className={`font-mono ${c}`}>{v}</span></div>)}
      </div>
      <div className="px-3.5 py-2 bg-[#FFF8E6] text-[11.5px] leading-snug text-[#8A5A00]">Health supplements overspent by RM 120. Daily grocery limit auto-adjusted to RM 25.00.</div>
    </div>
  );
}

function BudgetCard() {
  return (
    <div className="w-[250px] bg-white rounded-[6px] overflow-hidden shadow-sm text-[#191919]">
      <div className="px-3.5 pt-3 text-[11px] text-[#8A8A8A]">今日预算 · Today's Budget</div>
      <div className="px-3.5 pb-2"><span className="font-mono text-[30px] font-semibold">RM 25.00</span><span className="text-[13px] text-[#888]"> / 日</span></div>
      <div className="px-3.5 py-2 border-t border-[#F2F2F2] text-[13px] space-y-1">
        <div className="flex justify-between"><span>🥬 买餸 Groceries</span><span className="font-mono">RM 25.00</span></div>
        <div className="flex justify-between"><span>💊 医药 Medical</span><span className="font-mono">RM 300 🔒</span></div>
        <div className="flex justify-between"><span>💡 水电 Utilities</span><span className="font-mono">RM 200 🔒</span></div>
      </div>
      <div className="px-3.5 py-2 bg-[#FFF8E6] text-[12px] text-[#8A5A00]">⚠️ 保健品上周超支 RM 120</div>
    </div>
  );
}

function NoticeCard({ m }) {
  return (
    <div className="w-[260px] bg-white rounded-[6px] p-3.5 shadow-sm">
      <div className="flex items-center gap-1.5 text-[11px] text-[#8A8A8A]"><CheckCircle2 size={13} className="text-wx-green" /> {m.title}</div>
      <p className="mt-1.5 text-[14px] leading-snug text-[#191919]">{m.text}</p>
      {m.foot && <p className="mt-1.5 text-[12px] font-mono text-[#666]">{m.foot}</p>}
    </div>
  );
}

function AlertCard({ m, onApprove, onReject }) {
  return (
    <div className={`w-[272px] bg-white rounded-[6px] overflow-hidden shadow-md ${m.status === 'pending' ? 'ring-2 ring-red-500 red-pulse' : ''}`}>
      <div className="px-3.5 py-2 bg-red-600 text-white text-[12px] font-semibold flex items-center gap-1.5"><AlertTriangle size={14} /> URGENT TIER-3 INTERCEPTION</div>
      <div className="px-3.5 py-3 text-[13px] leading-snug text-[#191919] space-y-2">
        <p>Ah Por attempted to transfer <b className="font-mono">RM {fmt(m.amount)}</b> to unverified account <code className="font-mono text-[12px] bg-red-50 text-red-700 px-1 rounded">Acct #9910-SCAM</code>.</p>
        <p className="text-[12px] text-[#666]"><b className="text-[#191919]">AI Risk Trigger:</b> Scam keyword detected ('解冻奖金 / Unfreeze Prize') + Exceeds RM 50 limit.</p>
        <div className="flex items-center gap-1.5 text-[11px] text-red-700 bg-red-50 rounded px-2 py-1"><Snowflake size={12} /> Funds frozen until you decide</div>
      </div>
      {m.status === 'pending' ? (
        <div className="grid grid-cols-2 border-t border-[#EEE] text-[14px] font-medium">
          <button onClick={() => onApprove(m)} className="py-3 text-[#576B95] hover:bg-[#F5F5F5] border-r border-[#EEE]">✅ Approve Transfer</button>
          <button onClick={() => onReject(m)} className="py-3 text-red-600 hover:bg-red-50">❌ Reject &amp; Block Scammer</button>
        </div>
      ) : (
        <div className={`border-t border-[#EEE] py-2.5 text-center text-[13px] font-medium ${m.status === 'rejected' ? 'text-red-600' : 'text-[#576B95]'}`}>
          {m.status === 'rejected' ? '❌ Rejected · Scammer blocked' : '✅ Approved · Transfer released'}
        </div>
      )}
    </div>
  );
}

function ChatMessage({ m, me, onConfirm, onApprove, onReject }) {
  const big = me === 'parent';
  if (m.kind === 'time') return <div className="text-center text-[12px] text-[#A0A0A0] py-1">{m.text}</div>;
  if (m.kind === 'system') return <div className="flex justify-center"><span className="text-[12px] text-[#888] bg-[#DADADA]/60 rounded px-2 py-0.5">{m.text}</span></div>;
  if (m.kind === 'confirm') {
    return (
      <div className="pop px-1">
        <button disabled={m.used} onClick={() => onConfirm(m)}
          className={`w-full rounded-xl py-3.5 px-3 text-[17px] font-semibold shadow-sm transition ${m.used ? 'bg-[#DADADA] text-[#888]' : 'bg-wx-green text-white hover:bg-[#06AD56] active:scale-[.98] ring-4 ring-wx-green/25'}`}>
          {m.used ? '✓ 已确认 Confirmed' : <>🗣️ Confirm Pay RM 42.50 <span className="block text-[14px] font-normal opacity-90">(“好，确认缴费”)</span></>}
        </button>
      </div>
    );
  }
  const out = m.side === 'out';
  const who = out ? me : me === 'parent' ? 'bot' : 'guardbot';
  let body;
  switch (m.kind) {
    case 'text':
      body = <Bubble side={m.side} big={big}>{m.text}{m.en && <span className="block mt-1.5 pt-1.5 border-t border-black/10 text-[12px] italic text-[#7A7A7A] leading-snug">EN: {m.en}</span>}</Bubble>;
      break;
    case 'voice': body = <VoiceMsg m={m} big={big} />; break;
    case 'bill': body = <BillImage />; break;
    case 'scam': body = <ScamCard />; break;
    case 'receipt': body = <ReceiptCard m={m} />; break;
    case 'insight': body = <InsightCard />; break;
    case 'budget': body = <BudgetCard />; break;
    case 'notice': body = <NoticeCard m={m} />; break;
    case 'alert': body = <AlertCard m={m} onApprove={onApprove} onReject={onReject} />; break;
    default: body = null;
  }
  return (
    <div className={`pop flex gap-2.5 items-start ${out ? 'flex-row-reverse' : ''}`}>
      <Avatar who={who} />
      <div className={`flex flex-col ${out ? 'items-end' : 'items-start'} max-w-[78%] min-w-0`}>{body}</div>
    </div>
  );
}

/* ---------- WeChat phone shell ---------- */
function Phone({ title, typing, messages, me, footer, handlers }) {
  const time = useClock();
  const scrollRef = useRef(null);
  useEffect(() => { const el = scrollRef.current; if (el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' }); }, [messages.length, typing]);
  return (
    <div className="h-full w-full max-w-[372px] mx-auto rounded-[46px] bg-[#0E0E0E] p-[9px] shadow-[0_24px_60px_-20px_rgba(0,0,0,.45)] ring-1 ring-black/50">
      <div className="relative h-full rounded-[38px] overflow-hidden bg-wx-bg flex flex-col font-wx">
        {/* status bar */}
        <div className="h-11 shrink-0 px-7 flex items-center justify-between text-[14px] font-semibold text-black relative">
          <span>{time}</span>
          <div className="absolute left-1/2 -translate-x-1/2 top-2 w-[96px] h-[26px] rounded-full bg-black" />
          <div className="flex items-center gap-1"><Signal size={15} strokeWidth={2.6} /><Wifi size={15} strokeWidth={2.6} /><BatteryFull size={20} strokeWidth={2} /></div>
        </div>
        {/* nav bar */}
        <div className="h-11 shrink-0 px-2 flex items-center justify-between border-b border-wx-line/70 bg-wx-bg">
          <div className="flex items-center text-[#191919] w-16"><ChevronLeft size={24} strokeWidth={2} /><span className="text-[15px] -ml-0.5">3</span></div>
          <div className="text-center leading-tight min-w-0">
            <div className="text-[16px] font-semibold text-[#191919] truncate">{typing ? '对方正在输入…' : title}</div>
          </div>
          <div className="w-16 flex justify-end pr-1.5"><MoreHorizontal size={22} className="text-[#191919]" /></div>
        </div>
        {/* messages */}
        <div ref={scrollRef} className="flex-1 min-h-0 overflow-y-auto no-scrollbar px-3 py-3 space-y-4">
          {messages.map((m) => <ChatMessage key={m.id} m={m} me={me} {...handlers} />)}
          {typing && (
            <div className="flex gap-2.5 items-start pop">
              <Avatar who={me === 'parent' ? 'bot' : 'guardbot'} />
              <div className="relative bg-white tail-in rounded-[5px] px-3.5 py-3 flex gap-1">
                <span className="dot w-1.5 h-1.5 rounded-full bg-[#999]" /><span className="dot w-1.5 h-1.5 rounded-full bg-[#999]" /><span className="dot w-1.5 h-1.5 rounded-full bg-[#999]" />
              </div>
            </div>
          )}
        </div>
        {footer}
        <div className="h-5 shrink-0 bg-wx-bar flex items-center justify-center"><div className="w-28 h-1 rounded-full bg-black/80" /></div>
      </div>
    </div>
  );
}

function ParentInput({ busy, onSpeak, onSnap, onText }) {
  const [mode, setMode] = useState('voice');
  const [holding, setHolding] = useState(false);
  const [text, setText] = useState('');
  const send = () => { if (text.trim()) { onText(text.trim()); setText(''); } };
  return (
    <div className="shrink-0 bg-wx-bar border-t border-wx-line/70 px-2 py-2 flex items-center gap-2">
      <button onClick={() => setMode(mode === 'voice' ? 'text' : 'voice')} className="w-8 h-8 rounded-full border-[1.6px] border-[#191919] flex items-center justify-center shrink-0" title="Switch voice / text">
        {mode === 'voice' ? <Keyboard size={16} /> : <Mic size={16} />}
      </button>
      {mode === 'voice' ? (
        <button disabled={busy}
          onPointerDown={() => setHolding(true)}
          onPointerLeave={() => setHolding(false)}
          onPointerUp={() => { if (holding) { setHolding(false); onSpeak(); } }}
          className={`flex-1 h-11 rounded-md text-[15px] font-semibold select-none transition ${holding ? 'bg-[#C8C8C8] text-[#191919]' : 'bg-white text-[#191919] hover:bg-[#FAFAFA]'} disabled:opacity-50`}>
          {holding ? '松开 发送 · Release to send' : '🎙️ 按住 说话 · Hold to Speak Dialect'}
        </button>
      ) : (
        <input value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && send()} placeholder="Type a message…"
          className="flex-1 h-10 rounded-md bg-white px-3 text-[15px] outline-none" />
      )}
      <Smile size={26} strokeWidth={1.6} className="text-[#191919] shrink-0" />
      <button disabled={busy} onClick={onSnap} title="Snap Bill Photo" className="w-9 h-9 rounded-full bg-wx-green text-white flex items-center justify-center shrink-0 hover:bg-[#06AD56] disabled:opacity-50">
        <Camera size={18} />
      </button>
    </div>
  );
}

/* ---------- Terminal ---------- */
function LogPanel({ logs }) {
  const ref = useRef(null);
  const [copied, setCopied] = useState(false);
  useEffect(() => { if (ref.current) ref.current.scrollTop = ref.current.scrollHeight; }, [logs.length]);
  const copy = async () => {
    const text = logs.map((l) => `[${l.t}] [${l.tag}] ${l.text}`).join('\n');
    try { await navigator.clipboard.writeText(text); } catch (e) { console.log(text); }
    setCopied(true); setTimeout(() => setCopied(false), 1500);
  };
  const tagColor = { info: 'text-cyan-300', ok: 'text-lime-300', warn: 'text-amber-300', crit: 'text-red-400' };
  return (
    <div className="h-[180px] shrink-0 bg-slate-950 border-t border-slate-800 flex flex-col">
      <div className="h-8 shrink-0 px-4 flex items-center justify-between border-b border-slate-800">
        <div className="flex items-center gap-2 text-[11px] font-mono font-semibold tracking-wider text-slate-300">
          <Terminal size={13} className="text-emerald-400" /> LIVE SANDBOX EXECUTION LOGS (EXPORTABLE JSON/TEXT)
          <span className="ml-2 w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse" />
        </div>
        <button onClick={copy} className="flex items-center gap-1.5 text-[11px] font-mono text-slate-300 hover:text-white border border-slate-700 hover:border-slate-500 rounded px-2 py-0.5">
          {copied ? <Check size={12} className="text-emerald-400" /> : <Copy size={12} />} {copied ? 'Copied' : 'Copy Logs'}
        </button>
      </div>
      <div ref={ref} className="flex-1 overflow-y-auto thin-scroll px-4 py-2 font-mono text-xs leading-[1.6] text-emerald-400">
        {logs.map((l, i) => (
          <div key={i} className="whitespace-pre-wrap break-all">
            <span className="text-slate-500">[{l.t}]</span> <span className={tagColor[l.level] || 'text-cyan-300'}>[{l.tag}]</span>{' '}
            <span className={l.level === 'crit' ? 'text-red-300' : l.level === 'warn' ? 'text-amber-200' : ''}>{l.text}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [balance, setBalance] = useState(INITIAL_BALANCE);

  const [tier, setTier] = useState(null);
  const [utilUsed, setUtilUsed] = useState(0);
  const [txns, setTxns] = useState(initTxns);
  const [pMsgs, setPMsgs] = useState(initParent);
  const [cMsgs, setCMsgs] = useState(initChild);
  const [logs, setLogs] = useState(initLogs);
  const [busy, setBusy] = useState(false);
  const [pTyping, setPTyping] = useState(false);
  const [cTyping, setCTyping] = useState(false);
  const [blacklist, setBlacklist] = useState([]);
  const [flashKey, setFlashKey] = useState(0);
  const timers = useRef([]);
  const txnSeq = useRef(88901);
  const bal = useRef(INITIAL_BALANCE);

  const log = (tag, text, level = 'info') => setLogs((l) => [...l, { t: clock(), tag, text, level }]);
  const pushP = (m) => setPMsgs((a) => [...a, { id: m.id || nid(), ...m }]);
  const pushC = (m) => setCMsgs((a) => [...a, { id: m.id || nid(), ...m }]);
  const updP = (id, patch) => setPMsgs((a) => a.map((m) => (m.id === id ? { ...m, ...patch } : m)));
  const updC = (id, patch) => setCMsgs((a) => a.map((m) => (m.id === id ? { ...m, ...patch } : m)));
  const updTxn = (id, patch) => setTxns((a) => a.map((t) => (t.id === id ? { ...t, ...patch } : t)));
  const debit = (amt) => { const old = bal.current; bal.current = +(old - amt).toFixed(2); setBalance(bal.current); return [old, bal.current]; };
  const run = (steps, done) => {
    let t = 0;
    steps.forEach(([d, fn]) => { t += d; timers.current.push(setTimeout(fn, t)); });
    timers.current.push(setTimeout(() => { setBusy(false); done && done(); }, t + 50));
  };
  const nextTxn = () => `TXN_${txnSeq.current++}`;

  /* Scenario 1 — Tier 1 read-only */
  const scenario1 = () => {
    if (busy) return;
    setBusy(true);
    log('UI', 'Scenario 1 triggered: Dialect Budget Check (Tier 1 - Read Only)', 'ok');
    run([
      [300, () => pushP({ side: 'out', kind: 'voice', dur: 6, dialect: 'Cantonese-MY', text: '阿女话我今日去巴刹买餸，可以用几多钱呀？', en: 'How much can I spend on groceries at the pasar (market) today?' })],
      [700, () => log('Voice-Ingest', 'WeChat voice msg received | 6.2s | 16kHz opus | sender=Mdm.Tan (8829-102)')],
      [600, () => log('ASR-QLoRA', 'Model: malaysian-whisper-v3 | Dialect: Cantonese-MY (conf 0.94) | Text: "阿女话我今日去巴刹买餸，可以用几多钱呀？"')],
      [500, () => log('NLU-Intent', 'intent=QUERY_DAILY_BUDGET | slots={category:"groceries", date:"today"} | conf 0.97')],
      [500, () => { log('Guardrail-Gateway', 'Rule Check: action_type == READ_ONLY -> Assigned TIER_1 (Zero Risk) | no funds movement', 'ok'); setTier(1); }],
      [500, () => log('Sandbox-API', 'GET /v2/accounts/8829-102/budget?period=2026-10 -> 200 OK (38ms)')],
      [400, () => log('Budget-Engine', 'Daily_Grocery_Limit=25.00 | Supplements_Overspend=120.00 | limit adjusted from 30.00 -> 25.00', 'warn')],
      [300, () => { log('LLM-Response', 'Rendering reply in Cantonese-MY | numbers injected from ledger (symbolic), not generated'); setPTyping(true); }],
      [1300, () => { setPTyping(false); pushP({ side: 'in', kind: 'voice', dur: 9, dialect: 'Cantonese-MY', text: '婆婆，今日买餸可以用 RM 25 蚊。上个礼拜保健品用多咗 RM 120，所以每日限额调低咗少少，慢慢使啊。', en: 'Grandma, you can spend RM 25 on groceries today. Supplements went RM 120 over last week, so the daily limit was lowered a little. Spend slowly.' }); }],
      [700, () => pushP({ side: 'in', kind: 'budget' })],
      [200, () => log('TTS', 'Voice reply synthesized | voice=cantonese-female-warm | 9.1s | delivered', 'ok')],
    ]);

  /* Scenario 2 — Tier 2 whitelisted bill */
  const scenario2 = () => {

    const txnId = nextTxn();
    log('UI', 'Scenario 2 triggered: Real TNB Bill OCR & Auto-Pay (Tier 2 - Whitelist < RM50)', 'ok');
    run([

      [700, () => log('ASR-QLoRA', 'Model: malaysian-whisper-v3 | Dialect: Cantonese-MY + Malay code-switch | Text: "帮我睇下呢张 Bil Api 几多钱？顺便交埋佢"')],

      [500, () => log('Payee-Registry', 'Lookup "Tenaga Nasional Berhad" in Official_Whitelist -> MATCH (biller 40092, DuitNow verified)')],
      [500, () => { log('Guardrail-Gateway', 'Rule Check: Payee in Official_Whitelist == TRUE && Amount <= 50.00 -> Assigned TIER_2 | requires VOICE_CONFIRM', 'ok'); setTier(2); }],
      [400, () => { log('Sandbox-API', `POST /v2/payments (staged) -> ${txnId} PENDING_VOICE`); setTxns((a) => [...a, { id: txnId, payee: 'Tenaga Nasional Berhad', amount: 42.5, tier: 2, status: 'PENDING_VOICE' }]); setPTyping(true); }],

      [400, () => log('Guardrail-Gateway', `TIER_2 conditions satisfied for ${txnId} -> EXECUTE`)],

        setUtilUsed((u) => u + 42.5);
        updTxn(txnId, { status: 'SUCCESS' });
        log('Sandbox-Ledger', `${txnId} COMMITTED | Old_Bal: ${o.toFixed(2)} | New_Bal: ${n.toFixed(2)} | hash: 0x${hex(16)}`, 'ok');
        setPTyping(true);
      }],
      [900, () => { setPTyping(false); pushP({ side: 'in', kind: 'receipt', payee: 'Tenaga Nasional Berhad', amount: 42.5, txnId, balance: bal.current }); }],
      [500, () => pushP({ side: 'in', kind: 'text', text: '交咗啦婆婆 👍 电费已经搞掂。', en: 'Done, Grandma — the electricity bill is paid.' })],
      [600, () => { log('Family-Notify', 'Push -> Guardian WeChat (Wei Ming) | type=TIER_2_RECEIPT | delivered'); pushC({ kind: 'time', text: hhmm() }); }],
      [200, () => pushC({ side: 'in', kind: 'notice', title: 'Payment notice · Tier 2', text: 'Ah Por paid TNB electricity bill RM 42.50 (whitelisted biller, voice-confirmed).', foot: `${txnId} · Balance RM ${fmt(bal.current)}` })],
    ]);
  };

  /* Scenario 3 — Tier 3 scam freeze */
  const scenario3 = () => {
    if (busy) return;
    setBusy(true);
    const txnId = nextTxn();
    const alertId = nid();
    log('UI', 'Scenario 3 triggered: Scam Bill / RM800 Transfer Intercept (Tier 3 - Guardian Co-Sign)', 'ok');
    run([
      [300, () => pushP({ side: 'out', kind: 'scam' })],
      [700, () => pushP({ side: 'out', kind: 'voice', dur: 7, dialect: 'Cantonese-MY', text: '佢话我中咗奖喎，要先过 RM 800 解冻奖金，帮我过数畀佢啦。', en: 'They say I won a prize and must transfer RM 800 first to unfreeze it. Please send it for me.' })],
      [600, () => log('Content-Scan', 'Forwarded msg parsed | URL: hxxp://lucky-draw-my[.]xyz | domain_age=3d | WHOIS privacy=ON', 'warn')],
      [500, () => log('ASR-QLoRA', 'Model: malaysian-whisper-v3 | Dialect: Cantonese-MY | Text: "佢话我中咗奖喎，要先过 RM 800 解冻奖金，帮我过数畀佢啦。"')],
      [400, () => log('NLU-Intent', 'intent=TRANSFER_FUNDS | payee="Acct #9910-SCAM" | amount=800.00 | conf 0.95')],
      [500, () => log('Scam-Classifier', "Keywords hit: '解冻奖金 / Unfreeze Prize', '中奖 / Won prize', '限时 / Urgent' | risk_score=0.97 (HIGH)", 'crit')],
      [400, () => log('OWASP-LLM01', 'Prompt-injection check on forwarded content: instruction-like text quarantined | agent tool-call transfer() BLOCKED', 'crit')],
      [400, () => log('Payee-Registry', 'Acct #9910-SCAM NOT in whitelist | mule-account DB hit: 3 police reports', 'crit')],
      [500, () => {
        log('Guardrail-Gateway', 'Rule Check: Payee_Verified == FALSE || Amount (800.00) > 50.00 -> Assigned TIER_3 -> FREEZE', 'crit');
        setTier(3); setFrozen(800); setFlashKey((k) => k + 1);
        setTxns((a) => [...a, { id: txnId, payee: 'Acct #9910-SCAM (Unverified)', amount: 800, tier: 3, status: 'FROZEN_TIER_3' }]);
      }],
      [400, () => log('Sandbox-Ledger', `HOLD placed ${txnId} | RM 800.00 FROZEN | Available: ${bal.current.toFixed(2)} -> ${(bal.current - 800).toFixed(2)}`, 'crit')],
      [400, () => { log('Maker-Checker', 'Co-sign request dispatched -> Guardian WeChat (Son: Wei Ming) | TTL 30 min | channel=E2E'); setPTyping(true); setCTyping(true); }],
      [900, () => { setCTyping(false); pushC({ kind: 'time', text: hhmm() }); pushC({ id: alertId, side: 'in', kind: 'alert', amount: 800, txnId, status: 'pending' }); }],
      [500, () => { setPTyping(false); pushP({ side: 'in', kind: 'voice', dur: 8, dialect: 'Cantonese-MY', text: '婆婆，呢单好似系骗局。我已经暂停咗呢笔 RM 800，等阿明确认先，唔使惊。', en: "Grandma, this looks like a scam. I've paused this RM 800 transfer until Ming confirms. Don't worry." }); }],
    ]);
  };

  const rejectScam = (m) => {
    if (m.status !== 'pending') return;
    updC(m.id, { status: 'rejected' });
    setBusy(true);
    run([
      [100, () => log('Maker-Checker', `Guardian decision: REJECT ${m.txnId} | signed with device-bound key (Wei Ming, iPhone) | ECDSA ok`, 'ok')],
      [500, () => { updTxn(m.txnId, { status: 'BLOCKED_BY_GUARDIAN' }); setFrozen(0); log('Sandbox-Ledger', `HOLD RELEASED ${m.txnId} -> CANCELLED | RM 800.00 returned | Available: ${bal.current.toFixed(2)}`, 'ok'); }],
      [400, () => { setBlacklist((b) => [...new Set([...b, 'Acct #9910-SCAM'])]); log('Payee-Registry', 'Acct #9910-SCAM added to Family_Blacklist | future transfers auto-blocked', 'ok'); }],
      [300, () => log('Report', 'Scam report queued -> NSRC 997 (sandbox mode, not transmitted)')],
      [300, () => { pushC({ kind: 'system', text: '你已拒绝此转账 · You rejected this transfer' }); setCTyping(true); }],
      [700, () => { setCTyping(false); pushC({ side: 'in', kind: 'notice', title: 'Guardian action complete', text: '✅ Transfer blocked. Scammer blacklisted. RM 800.00 returned to Ah Por\'s available balance.', foot: `${m.txnId} · BLOCKED_BY_GUARDIAN` }); setPTyping(true); }],
      [800, () => { setPTyping(false); pushP({ side: 'in', kind: 'voice', dur: 10, dialect: 'Cantonese-MY', text: '婆婆，阿明已经帮你拦住咗，呢个系骗子嚟㗎。啲钱一蚊都冇少，安心啦。下次有人话中奖要先畀钱，一定系呃人嘅。', en: "Grandma, Ming has blocked it — it was a scammer. You haven't lost a single ringgit. Next time someone says you've won a prize but must pay first, it's always a scam." }); }],
      [600, () => { pushP({ side: 'in', kind: 'text', text: '🛡️ 户口安全 · RM 800 已经解冻', en: 'Account safe. RM 800 unfrozen.' }); log('TTS', 'Comfort voice note delivered to Mdm.Tan | voice=cantonese-female-warm', 'ok'); }],
    ]);
  };

  const approveScam = (m) => {
    if (m.status !== 'pending') return;
    updC(m.id, { status: 'approved' });
    setBusy(true);
    run([
      [100, () => log('Maker-Checker', `Guardian decision: APPROVE ${m.txnId} | signed with device-bound key (Wei Ming, iPhone)`, 'warn')],
      [500, () => { setFrozen(0); const [o, n] = debit(800); updTxn(m.txnId, { status: 'SUCCESS' }); log('Sandbox-Ledger', `${m.txnId} COMMITTED (guardian override) | Old_Bal: ${o.toFixed(2)} | New_Bal: ${n.toFixed(2)} | hash: 0x${hex(16)}`, 'warn'); }],
      [400, () => { pushC({ kind: 'system', text: '你已批准此转账 · You approved this transfer' }); setPTyping(true); }],
      [800, () => { setPTyping(false); pushP({ side: 'in', kind: 'voice', dur: 5, dialect: 'Cantonese-MY', text: '婆婆，阿明已经批准咗，RM 800 已经过咗数。', en: 'Grandma, Ming approved it. The RM 800 has been transferred.' }); }],
    ]);
  };

  /* free-text fallback — Tier 1 reply */
  const sendText = (text) => {
    if (busy) return;
    setBusy(true);
    pushP({ side: 'out', kind: 'text', text });
    run([
      [500, () => log('NLU-Intent', `Text input: "${text}" | intent=GENERAL_QUERY -> TIER_1 read-only`)],
      [300, () => { setTier(1); setPTyping(true); }],
      [1000, () => { setPTyping(false); pushP({ side: 'in', kind: 'text', text: `收到婆婆！今日买餸仲可以用 RM 25.00，户口余额 RM ${fmt(bal.current - frozen)}。`, en: `Got it! You can still spend RM 25.00 on groceries today. Available balance RM ${fmt(bal.current - frozen)}.` }); }],
    ]);
  };

  const reset = () => {
    timers.current.forEach(clearTimeout); timers.current = [];
    bal.current = INITIAL_BALANCE; txnSeq.current = 88901;
    setBalance(INITIAL_BALANCE); setFrozen(0); setTier(null); setUtilUsed(0); setTxns(initTxns());
    setPMsgs(initParent()); setCMsgs(initChild()); setBlacklist([]); setBusy(false); setPTyping(false); setCTyping(false); setFlashKey(0);
    setLogs([...initLogs(), { t: clock(), tag: 'System', text: 'Sandbox state reset by operator', level: 'warn' }]);
  };

  const scenarios = [
    { label: 'Scenario 1: Dialect Budget Check', sub: 'Tier 1 - Read Only', dot: 'bg-emerald-500', fn: scenario1 },
    { label: 'Scenario 2: Real TNB Bill OCR & Auto-Pay', sub: 'Tier 2 - Whitelist < RM50', dot: 'bg-blue-500', fn: scenario2 },
    { label: 'Scenario 3: Scam Bill / RM800 Transfer Intercept', sub: 'Tier 3 - Guardian Co-Sign', dot: 'bg-red-500', fn: scenario3 },
  ];

  return (
    <div className="h-full flex flex-col font-sans">
      {/* header */}
      <header className="shrink-0 bg-[#111111] text-white px-5 py-2.5 flex items-center gap-5 border-b border-black">
        <div className="flex items-center gap-2.5 shrink-0">
          <div className="w-9 h-9 rounded-lg bg-wb-lime flex items-center justify-center"><ShieldCheck size={20} className="text-[#111]" /></div>
          <div className="leading-tight">
            <h1 className="text-[15px] font-bold tracking-tight">DialectGuard <span className="text-white/50 font-normal">—</span> <span className="font-medium text-white/85">Multi-Dialect Financial Agent &amp; Family Guardrail Sandbox</span></h1>
            <p className="text-[10px] font-semibold tracking-[.14em] uppercase text-white/45">Split-screen command center · FinTech hackathon demo</p>
          </div>
        </div>
        <div className="ml-auto flex items-center gap-2 flex-wrap justify-end">
          {scenarios.map((s) => (
            <button key={s.label} onClick={s.fn} disabled={busy}
              className="group flex items-center gap-2 rounded-lg bg-white/[.07] hover:bg-white/[.13] border border-white/10 px-3 py-1.5 text-left disabled:opacity-40 disabled:cursor-not-allowed transition">
              <span className={`w-2 h-2 rounded-full ${s.dot}`} />
              <span className="leading-tight"><span className="block text-[12px] font-semibold">{s.label}</span><span className="block text-[10px] text-white/55">{s.sub}</span></span>
            </button>
          ))}
          <button onClick={reset} className="flex items-center gap-1.5 rounded-lg border border-wb-lime/60 text-wb-lime hover:bg-wb-lime hover:text-[#111] px-3 py-2 text-[12px] font-semibold transition">
            <RotateCcw size={13} /> Reset Sandbox State
          </button>
        </div>
      </header>

      {/* main grid */}
      <main className="flex-1 min-h-0 grid grid-cols-[minmax(300px,372px)_1fr_minmax(300px,372px)] gap-5 px-5 py-3">
        <div className="min-h-0 flex flex-col gap-2">
          <p className="text-[11px] font-semibold tracking-[.12em] uppercase text-[#555] text-center">👵 Parent · Ah Por's Phone</p>
          <div className="flex-1 min-h-0">
            <Phone title="DialectGuard 理财助手 ✓" typing={pTyping} messages={pMsgs} me="parent" handlers={{ onConfirm: confirmPay }}
              footer={<ParentInput busy={busy} onSpeak={scenario1} onSnap={scenario2} onText={sendText} />} />
          </div>
        </div>
        <div className="min-h-0 flex flex-col gap-2">
          <p className="text-[11px] font-semibold tracking-[.12em] uppercase text-[#555] text-center">🏦 Open Banking Sandbox &amp; Permission Engine · Live Backend State</p>
          <div className="flex-1 min-h-0">
            <BankPanel balance={balance} frozen={frozen} tier={tier} utilUsed={utilUsed} txns={txns} blacklist={blacklist} flashKey={flashKey} />
          </div>
        </div>
        <div className="min-h-0 flex flex-col gap-2">
          <p className="text-[11px] font-semibold tracking-[.12em] uppercase text-[#555] text-center">👨 Guardian · Son's Phone (Wei Ming)</p>
          <div className="flex-1 min-h-0">
            <Phone title="DialectGuard Family Alert" typing={cTyping} messages={cMsgs} me="child" handlers={{ onApprove: approveScam, onReject: rejectScam }}
              footer={<GuardianInput />} />
          </div>
        </div>
      </main>

      <LogPanel logs={logs} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
